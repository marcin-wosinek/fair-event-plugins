name: Deploy to Environment

on:
    workflow_call:
        inputs:
            environment:
                description: 'Environment to deploy to'
                required: true
                type: string
            release_tag:
                description: 'GitHub release tag to deploy (e.g., build-1.0.0)'
                required: true
                type: string
            is_clean_version:
                description: 'Whether the release tag is a clean semver (no pre-release suffix)'
                required: false
                type: string
                default: 'false'
            is_manual_deploy:
                description: 'Whether this was triggered manually (workflow_dispatch) — skips AUTO_DEPLOY_ON_RELEASE gate'
                required: false
                type: boolean
                default: false

permissions:
    contents: read

jobs:
    check:
        name: Auto-deploy gate for ${{ inputs.environment }}
        runs-on: ubuntu-latest
        environment: ${{ inputs.environment }}
        outputs:
            should_deploy: ${{ steps.gate.outputs.should_deploy }}
        steps:
            - name: Check AUTO_DEPLOY_ON_RELEASE
              id: gate
              env:
                  IS_MANUAL_DEPLOY: ${{ inputs.is_manual_deploy }}
                  IS_CLEAN_VERSION: ${{ inputs.is_clean_version }}
                  AUTO_DEPLOY_ON_RELEASE: ${{ vars.AUTO_DEPLOY_ON_RELEASE }}
                  TARGET_ENVIRONMENT: ${{ inputs.environment }}
              run: |
                  if [ "$IS_MANUAL_DEPLOY" = "true" ]; then
                    echo "should_deploy=true" >> "$GITHUB_OUTPUT"
                    echo "Manual deploy — skipping AUTO_DEPLOY_ON_RELEASE gate"
                  elif [ "$IS_CLEAN_VERSION" = "true" ] && [ "$AUTO_DEPLOY_ON_RELEASE" != "true" ]; then
                    echo "should_deploy=false" >> "$GITHUB_OUTPUT"
                    echo "Skipping: AUTO_DEPLOY_ON_RELEASE is not set to 'true' for $TARGET_ENVIRONMENT"
                  else
                    echo "should_deploy=true" >> "$GITHUB_OUTPUT"
                  fi

    deploy:
        name: Deploy to ${{ inputs.environment }}
        needs: [check]
        if: needs.check.outputs.should_deploy == 'true'
        runs-on: ubuntu-latest
        environment: ${{ inputs.environment }}
        # Shell steps read inputs and configuration from these variables,
        # never from `${{ }}` expressions inside a script.
        env:
            RELEASE_TAG: ${{ inputs.release_tag }}
            TARGET_ENVIRONMENT: ${{ inputs.environment }}
            SSH_PORT: ${{ vars.SSH_PORT }}
            SSH_USER: ${{ vars.SSH_USER }}
            SSH_HOST: ${{ vars.SSH_HOST }}
            WORDPRESS_PLUGINS_PATH: ${{ vars.WORDPRESS_PLUGINS_PATH }}

        steps:
            - name: Download release assets
              run: |
                  if [[ ! "$RELEASE_TAG" =~ ^build-[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+-g[0-9a-f]+)?$ ]]; then
                    echo "::error::The release_tag input must be build-X.Y.Z or build-X.Y.Z-N-gHASH."
                    exit 1
                  fi
                  mkdir -p dist
                  gh release download "$RELEASE_TAG" \
                    --repo "$GITHUB_REPOSITORY" \
                    --pattern "*.zip" \
                    --dir ./dist
                  echo "Downloaded assets:"
                  ls -la ./dist/
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract plugin ZIPs
              run: |
                  mkdir -p extracted-plugins
                  cd dist
                  for zip in *.zip; do
                    if [ -f "$zip" ]; then
                      echo "Extracting $zip..."
                      unzip -q "$zip" -d ../extracted-plugins/
                    fi
                  done
                  cd ..
                  ls -la extracted-plugins/

            - name: Print runner IP (debug)
              run: |
                  echo "Runner public IP (for allowlisting on the target host's firewall):"
                  curl -s https://ifconfig.me
                  echo ""

            - name: Setup SSH
              uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
              with:
                  ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

            - name: Add SSH host key
              env:
                  SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
              run: |
                  mkdir -p ~/.ssh
                  printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts

            - name: Deploy plugins via rsync
              id: rsync
              env:
                  PLUGINS_TO_DEPLOY: ${{ vars.PLUGINS_TO_DEPLOY }}
              run: |
                  MAX_ATTEMPTS=2
                  SSH_OPTS="-p $SSH_PORT -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=3"

                  if [ -z "$PLUGINS_TO_DEPLOY" ]; then
                    echo "ERROR: PLUGINS_TO_DEPLOY variable not set for environment $TARGET_ENVIRONMENT"
                    exit 1
                  fi

                  if [ "$PLUGINS_TO_DEPLOY" = "all" ]; then
                    PLUGINS="fair-events fair-payments-connector fair-audience fair-timetable fair-finance fair-events-experimental fair-payments-connector-experimental fair-form fair-audience-experimental"
                  else
                    # Convert comma-separated list to space-separated
                    PLUGINS=$(echo "$PLUGINS_TO_DEPLOY" | tr ',' ' ')
                  fi

                  echo "Deploying plugins: $PLUGINS"
                  echo "Release: $RELEASE_TAG"
                  echo ""

                  # Deploy each plugin from extracted directory
                  DEPLOYED_COUNT=0
                  SKIPPED_COUNT=0
                  DEPLOYED_PLUGINS=""

                  for plugin in $PLUGINS; do
                    if [ -d "extracted-plugins/$plugin" ]; then
                      echo "Deploying $plugin..."

                      ATTEMPT=1
                      while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
                        if timeout 300 rsync -avz --delete \
                          -e "ssh $SSH_OPTS" \
                          "extracted-plugins/$plugin/" \
                          "$SSH_USER@$SSH_HOST:$WORDPRESS_PLUGINS_PATH/$plugin/"; then
                          echo "✓ $plugin deployed successfully"
                          break
                        fi

                        echo "Attempt $ATTEMPT/$MAX_ATTEMPTS failed for $plugin"
                        if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
                          echo "ERROR: Failed to deploy $plugin after $MAX_ATTEMPTS attempts"
                          exit 1
                        fi
                        echo "Retrying in 10 seconds..."
                        sleep 10
                        ATTEMPT=$((ATTEMPT + 1))
                      done

                      echo ""
                      DEPLOYED_PLUGINS="${DEPLOYED_PLUGINS} ${plugin}"
                      DEPLOYED_COUNT=$((DEPLOYED_COUNT + 1))
                    else
                      echo "⚠ $plugin directory not found in extracted-plugins/, skipping..."
                      echo ""
                      SKIPPED_COUNT=$((SKIPPED_COUNT + 1))
                    fi
                  done

                  echo "deployed_plugins=${DEPLOYED_PLUGINS}" >> "$GITHUB_OUTPUT"

                  echo "========================================="
                  echo "Deployment Summary:"
                  echo "  Release: $RELEASE_TAG"
                  echo "  Deployed: $DEPLOYED_COUNT plugin(s)"
                  echo "  Skipped: $SKIPPED_COUNT plugin(s)"
                  echo "  Target: $SSH_HOST"
                  echo "========================================="

            - name: Reactivate plugins via WP-CLI
              env:
                  DEPLOYED_PLUGINS: ${{ steps.rsync.outputs.deployed_plugins }}
              run: |
                  SSH_OPTS=(-p "$SSH_PORT" -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=3)
                  REMOTE="$SSH_USER@$SSH_HOST"
                  WP_PATH="$WORDPRESS_PLUGINS_PATH/../.."

                  for plugin in $DEPLOYED_PLUGINS; do
                    echo "Reactivating $plugin..."
                    # The remote shell parses this command, so quote each value.
                    REMOTE_COMMAND=$(printf 'cd %q && wp plugin deactivate %q && wp plugin activate %q' "$WP_PATH" "$plugin" "$plugin")
                    if ssh "${SSH_OPTS[@]}" "$REMOTE" "$REMOTE_COMMAND"; then
                      echo "✓ $plugin reactivated"
                    else
                      echo "⚠ Failed to reactivate $plugin (plugin may not have been active)"
                    fi
                  done

            # The Mollie OAuth proxy (#2290). Runs after every deploy to
            # fair-event-plugins.com, whichever plugins it shipped: another
            # Fair plugin's older shared library can pause Fair Platform
            # without any PHP error. The script comes from the deployed
            # release tag, not from the branch that started the run.
            - name: Check out the OAuth proxy check
              if: inputs.environment == 'fair-event-plugins.com'
              uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.release_tag }}
                  path: release-source
                  sparse-checkout: scripts
                  persist-credentials: false

            - name: Verify the OAuth proxy is answering
              if: inputs.environment == 'fair-event-plugins.com'
              env:
                  PROXY_URL: https://fair-event-plugins.com
              run: |
                  SCRIPT=release-source/scripts/verify-oauth-proxy.mjs
                  if [ ! -f "$SCRIPT" ]; then
                    echo "::warning title=OAuth proxy not checked::Release $RELEASE_TAG predates the OAuth proxy check (#2290). Check $PROXY_URL/wp-json/fair-platform/v1/health by hand."
                    exit 0
                  fi

                  if ! node "$SCRIPT" --url="$PROXY_URL" --attempts=5 --delay=15000 --timeout=15000; then
                    {
                      echo "## OAuth proxy is not answering"
                      echo ""
                      echo "The deploy of \`$RELEASE_TAG\` finished, but $PROXY_URL is not serving the Mollie OAuth proxy, so connected sites can't refresh their Mollie tokens."
                      echo "See DEPLOYMENT.md § OAuth proxy monitoring for the likely causes and fixes."
                    } >> "$GITHUB_STEP_SUMMARY"
                    exit 1
                  fi
