name: Performance audit

permissions:
    contents: read

on:
    workflow_dispatch:
        inputs:
            samples:
                description: 'Warm samples per scenario/page (npm run performance -- --samples=N)'
                required: false
                default: '5'
            scenario:
                description: 'Focus one scenario only (npm run performance -- --scenario=NAME); leave blank for the full sweep'
                required: false
                default: ''

jobs:
    performance:
        runs-on: ubuntu-latest
        # Overrides the workflow-level `contents: read` default: this job
        # publishes the report to the performance-history branch via the
        # Contents API (scripts/performance-history.mjs), which needs write.
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v6

            - name: Setup PHP
              uses: shivammathur/setup-php@fcafdd6392932010c2bd5094439b8e33be2a8a09 # 2.37.0
              with:
                  php-version: '8.3'
                  extensions: mbstring, intl, zip
                  coverage: none

            - name: Cache Composer packages
              uses: actions/cache@v5
              with:
                  path: |
                      ./fair-payments-connector/vendor
                      ./fair-events/vendor
                      ./fair-platform/vendor
                      ./fair-audience/vendor
                      ./fair-timetable/vendor
                      ./fair-finance/vendor
                      ./fair-events-experimental/vendor
                      ./fair-payments-connector-experimental/vendor
                      ./fair-form/vendor
                      ./fair-audience-experimental/vendor
                      ./fair-calendar-button/vendor
                      ./vendor
                  key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '24'

            - name: Cache node_modules
              id: npm-cache
              uses: actions/cache@v5
              with:
                  path: |
                      ./node_modules
                      ./fair-events/node_modules
                      ./fair-payments-connector/node_modules
                      ./fair-platform/node_modules
                      ./fair-audience/node_modules
                      ./fair-timetable/node_modules
                      ./fair-finance/node_modules
                      ./fair-events-experimental/node_modules
                      ./fair-payments-connector-experimental/node_modules
                      ./fair-form/node_modules
                      ./fair-audience-experimental/node_modules
                      ./fair-calendar-button/node_modules
                      ./fair-events-shared/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

            - name: Install npm dependencies
              if: steps.npm-cache.outputs.cache-hit != 'true'
              run: HUSKY=0 npm ci --prefer-offline

            - name: Install WP-CLI
              run: |
                  curl -L -o wp-cli.phar https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
                  echo "be928f6b8ca1e8dfb9d2f4b75a13aa4aee0896f8a9a0a1c45cd5d2c98605e6172e6d014dda2e27f88c98befc16c040cbb2bd1bfa121510ea5cdf5f6a30fe8832  wp-cli.phar" | sha512sum -c -
                  chmod +x wp-cli.phar
                  sudo mv wp-cli.phar /usr/local/bin/wp
                  wp --info

            - name: Cache Playwright browsers
              id: playwright-cache
              uses: actions/cache@v5
              with:
                  path: ~/.cache/ms-playwright
                  key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
                  restore-keys: ${{ runner.os }}-playwright-

            - name: Install Playwright browser
              run: |
                  if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
                      npx playwright install-deps chromium
                  else
                      npx playwright install --with-deps chromium
                  fi

            - name: Read PHP version from wp-env config
              id: wp-env-config
              run: echo "php_version=$(jq -r '.phpVersion' .wp-env.json)" >> $GITHUB_OUTPUT

            - name: Cache Docker images
              id: docker-cache
              uses: actions/cache@v5
              with:
                  path: /tmp/docker-images.tar
                  key: ${{ runner.os }}-docker-v2-${{ hashFiles('.wp-env.json') }}
                  restore-keys: ${{ runner.os }}-docker-v2-

            - name: Load cached Docker images
              if: steps.docker-cache.outputs.cache-hit == 'true'
              run: docker load -i /tmp/docker-images.tar

            - name: Pull Docker images
              if: steps.docker-cache.outputs.cache-hit != 'true'
              run: |
                  docker pull wordpress:php${{ steps.wp-env-config.outputs.php_version }}
                  docker pull wordpress:cli-php${{ steps.wp-env-config.outputs.php_version }}
                  docker pull mariadb:lts
                  docker pull phpmyadmin

            - name: Save Docker images to cache
              if: steps.docker-cache.outputs.cache-hit != 'true'
              run: docker save wordpress:php${{ steps.wp-env-config.outputs.php_version }} wordpress:cli-php${{ steps.wp-env-config.outputs.php_version }} mariadb:lts phpmyadmin -o /tmp/docker-images.tar

            - name: Test performance tooling
              run: |
                  node --test scripts/__tests__/performance-runner.test.mjs
                  node --test scripts/__tests__/performance-history.test.mjs
                  node --test scripts/__tests__/pr-assets.test.mjs

            - name: Run performance audit
              run: |
                  ARGS="--samples=${{ inputs.samples }} --out=performance-report.md --json-out=performance-report.json"
                  if [ -n "${{ inputs.scenario }}" ]; then
                      ARGS="$ARGS --scenario=${{ inputs.scenario }}"
                  fi
                  npm run performance -- $ARGS

            - name: Add report to job summary
              if: always()
              run: |
                  if [ -f performance-report.md ]; then
                      cat performance-report.md >> "$GITHUB_STEP_SUMMARY"
                  fi

            - name: Publish to performance-history branch
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if [ -f performance-report.json ]; then
                      node scripts/performance-history.mjs performance-report.json "${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
                  fi

            - name: Upload performance report
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: performance-report
                  path: |
                      performance-report.md
                      performance-report.json
                  retention-days: 30
                  if-no-files-found: ignore
