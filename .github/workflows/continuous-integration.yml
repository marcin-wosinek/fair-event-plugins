name: Continuous integration

permissions:
    contents: read

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Setup PHP
              uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # 2.37.0
              with:
                  php-version: '8.3'
                  extensions: mbstring, intl, zip
                  coverage: none

            - name: Validate composer.json for all plugins
              run: |
                  npm run composer:validate

            - name: Cache Composer packages
              id: composer-cache
              uses: actions/cache@v6
              with:
                  path: |
                      ./fair-payments-connector/vendor
                      ./fair-events/vendor
                      ./fair-platform/vendor
                      ./fair-audience/vendor
                      ./fair-timetable/vendor
                      ./fair-finance/vendor
                      ./fair-events-experimental/vendor
                      ./fair-payments-connector-experimental/vendor
                      ./fair-form/vendor
                      ./fair-audience-experimental/vendor
                      ./fair-calendar-button/vendor
                      ./vendor
                  key: ${{ runner.os }}-php8.3-${{ hashFiles('**/composer.lock', '**/composer.json', '!**/vendor/**', '!**/node_modules/**') }}
                  restore-keys: |
                      ${{ runner.os }}-php8.3-

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'

            - name: Cache node_modules
              id: npm-cache
              uses: actions/cache@v6
              with:
                  path: |
                      ./node_modules
                      ./fair-events/node_modules
                      ./fair-payments-connector/node_modules
                      ./fair-platform/node_modules
                      ./fair-audience/node_modules
                      ./fair-timetable/node_modules
                      ./fair-finance/node_modules
                      ./fair-events-experimental/node_modules
                      ./fair-payments-connector-experimental/node_modules
                      ./fair-form/node_modules
                      ./fair-audience-experimental/node_modules
                      ./fair-events-shared/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

            - name: Install npm dependencies
              if: steps.npm-cache.outputs.cache-hit != 'true'
              run: npm ci --prefer-offline

            - name: Install WP-CLI
              run: |
                  curl -L -o wp-cli.phar https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
                  echo "be928f6b8ca1e8dfb9d2f4b75a13aa4aee0896f8a9a0a1c45cd5d2c98605e6172e6d014dda2e27f88c98befc16c040cbb2bd1bfa121510ea5cdf5f6a30fe8832  wp-cli.phar" | sha512sum -c -
                  chmod +x wp-cli.phar
                  sudo mv wp-cli.phar /usr/local/bin/wp
                  wp --info

            - name: Cache WP-CLI packages
              id: wp-cli-packages-cache
              uses: actions/cache@v6
              with:
                  path: ~/.wp-cli/packages
                  key: ${{ runner.os }}-wp-cli-dist-archive-3.1

            - name: Install WP-CLI dist-archive command
              # setup-php writes the github-oauth token into Composer's global
              # auth.json. WP-CLI's bundled Composer is old and rejects modern
              # ghs_ tokens ("invalid characters"); COMPOSER_AUTH env can't undo
              # a file-based entry, so point Composer at a clean COMPOSER_HOME.
              # The dist-archive package is public, so no auth is needed.
              env:
                  COMPOSER_HOME: ${{ runner.temp }}/wp-cli-composer
              run: |
                  if ! wp dist-archive --help >/dev/null 2>&1; then
                      for attempt in 1 2 3; do
                          echo "Installing dist-archive-command (attempt ${attempt})..."
                          wp package install wp-cli/dist-archive-command:^3.1 && break
                          echo "Attempt ${attempt} failed; retrying in 15s..."
                          sleep 15
                      done
                  fi
                  wp package list
                  wp dist-archive --help

            - name: Install regular PHP dependencies in all plugins
              run: npm run composer:install:prod

            # Each plugin build also generates its block-docs/, but fails only
            # for its own blocks; this reports every plugin's gaps at once.
            - name: Check block documentation
              run: node scripts/block-docs.mjs check

            - name: Build JavaScript for all plugins
              run: npm run build

            - name: Stamp build version in plugin headers
              run: node scripts/stamp-build-version.js

            - name: Create plugin ZIP files using wp dist-archive
              # Same reason as the install step: keep WP-CLI's bundled Composer
              # away from setup-php's github-oauth token via a clean COMPOSER_HOME.
              env:
                  COMPOSER_HOME: ${{ runner.temp }}/wp-cli-composer
              run: |
                  npm run dist-archive
                  echo "Contents of dist directory:"
                  ls -lah ./dist/ || echo "dist directory not found"

            - name: Verify dist archives include composer dependencies and block docs
              run: node scripts/verify-dist-archive.cjs

            - name: Install dev PHP dependencies in all plugins
              run: npm run composer:install

            - name: Lint guideline docs
              run: npm run lint:docs

            - name: Validate agent workflows
              run: npm run validate:agent-workflows

            - name: Reject browser-native popups
              run: npm run validate:native-popups

            - name: Check translation text domains
              run: npm run validate:text-domains

            - name: Check PHP compatibility declarations
              run: npm run validate:php-compat

            # PHPUnit runs in the php-tests matrix, so the JavaScript suites
            # and artifacts are produced only once.
            - name: Run JavaScript and tooling tests
              run: |
                  npm run test:js
                  npm run test:tooling

            - name: Upload plugins
              uses: actions/upload-artifact@v7
              with:
                  name: plugins
                  path: ./dist/*.zip
                  retention-days: 7
                  if-no-files-found: error

    php-tests:
        name: PHP tests (PHP ${{ matrix.php }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # PHPUnit 13 requires PHP 8.4+; see TESTING.md § PHP versions.
                php: ['8.4', '8.5']

        steps:
            - uses: actions/checkout@v6

            - name: Setup PHP
              uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # 2.37.0
              with:
                  php-version: ${{ matrix.php }}
                  extensions: mbstring, intl, zip, gd, pcntl
                  coverage: none

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'

            - name: Get Composer cache directory
              id: composer-cache-dir
              run: echo "dir=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer downloads
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache-dir.outputs.dir }}
                  key: ${{ runner.os }}-composer-php${{ matrix.php }}-${{ hashFiles('**/composer.lock', '**/composer.json', '!**/vendor/**', '!**/node_modules/**') }}
                  restore-keys: |
                      ${{ runner.os }}-composer-php${{ matrix.php }}-

            - name: Validate PHP test tooling
              run: composer validate --strict --working-dir=tools/php-tests

            - name: Install PHP test tooling
              run: npm run test:php:install

            - name: Install PHP dependencies in all plugins
              run: npm run composer:install

            - name: Run PHP tests
              run: npm run test:php

            # Static analysis, independent of the PHP running it: one leg is enough.
            - name: Check shipped PHP against declared minimums
              if: matrix.php == '8.4'
              run: npm run test:php:compat

    php-runtime:
        name: PHP ${{ matrix.php }} runtime compatibility
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # One leg per minimum in scripts/php-compat.mjs POLICY.
                php: ['7.4', '8.0', '8.2']

        steps:
            - uses: actions/checkout@v6

            - name: Setup PHP
              uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # 2.37.0
              with:
                  php-version: ${{ matrix.php }}
                  extensions: mbstring, intl, zip, gd
                  coverage: none

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'

            - name: Get Composer cache directory
              id: composer-cache-dir
              run: echo "dir=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer downloads
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache-dir.outputs.dir }}
                  key: ${{ runner.os }}-composer-php${{ matrix.php }}-${{ hashFiles('**/composer.lock', '**/composer.json', '!**/vendor/**', '!**/node_modules/**') }}
                  restore-keys: |
                      ${{ runner.os }}-composer-php${{ matrix.php }}-

            - name: Install, platform-check, lint and autoload production code
              run: node scripts/php-compat.mjs runtime --minimum=${{ matrix.php }}

    release:
        name: Create Release PR
        runs-on: ubuntu-latest
        needs: [build, php-tests, php-runtime]
        if: github.ref == 'refs/heads/main'
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v6
              with:
                  # Full history with tags, so tag-release.js skips existing plugin tags.
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'

            - name: Cache node_modules
              id: npm-cache
              uses: actions/cache@v6
              with:
                  path: |
                      ./node_modules
                      ./fair-events/node_modules
                      ./fair-payments-connector/node_modules
                      ./fair-platform/node_modules
                      ./fair-audience/node_modules
                      ./fair-timetable/node_modules
                      ./fair-finance/node_modules
                      ./fair-events-shared/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

            - name: Install Dependencies
              if: steps.npm-cache.outputs.cache-hit != 'true'
              run: HUSKY=0 npm ci --prefer-offline

            - name: Create Release Pull Request
              uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
              with:
                  version-script: npm run version-packages
                  # Runs when no changesets are pending (after a release PR merges):
                  # creates and pushes per-plugin tags. Nothing is published to npm.
                  publish-script: npm run release -- --push
                  create-github-releases: false
                  # tag-release.js pushes its own tags.
                  push-git-tags: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    general-release:
        name: General release
        runs-on: ubuntu-latest
        needs: [build, php-tests, php-runtime]
        if: github.ref == 'refs/heads/main'
        permissions:
            contents: write
        steps:
            - name: Download build artifacts
              uses: actions/download-artifact@v8
              with:
                  name: plugins
                  path: ./dist

            - name: Checkout for git describe
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  path: repo

            - name: Create GitHub release
              run: |
                  BUILD_ID="$(git -C repo describe --tags --match='fair-events@*' | sed 's/^fair-events@//')"
                  if gh release view "build-${BUILD_ID}" --repo "$GITHUB_REPOSITORY" &>/dev/null; then
                    echo "Release build-${BUILD_ID} already exists, skipping."
                  else
                    gh release create "build-${BUILD_ID}" ./dist/*.zip \
                      --repo "$GITHUB_REPOSITORY" \
                      --target "$GITHUB_SHA" \
                      --title "Build ${BUILD_ID}" \
                      --notes "Automated build from commit ${GITHUB_SHA}" \
                      --prerelease
                  fi
              env:
                  GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
