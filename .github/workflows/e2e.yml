name: E2E

permissions:
    contents: read

on:
    push:
        branches: [main]
        paths:
            - 'fair-payments-connector/**'
            - 'fair-events/**'
            - 'fair-events-experimental/**'
            - 'fair-finance/**'
            - 'fair-audience/**'
            - 'fair-audience-experimental/**'
            - 'fair-form/**'
            - 'fair-platform/**'
            - 'fair-events-shared/**'
            - 'fair-timetable/**'
            - 'fair-calendar-button/**'
            - 'e2e/**'
            - 'playwright.config.js'
            - 'package.json'
            - 'scripts/api-test-runner.mjs'
            - 'scripts/workspace-e2e-runner.mjs'
            - 'scripts/block-docs.mjs'
            - 'scripts/__tests__/api-test-runner.test.mjs'
            - 'scripts/check-e2e-shards.mjs'
            - 'scripts/__tests__/check-e2e-shards.test.mjs'
            - 'scripts/shard-assignment.mjs'
            - 'scripts/shard-timings.mjs'
            - 'scripts/shard-timings/**'
            - 'scripts/__tests__/shard-assignment.test.mjs'
            - 'scripts/__tests__/shard-timings.test.mjs'
            - 'scripts/__tests__/fixtures/test-list/**'
            - '.wp-env.json'
            - '.github/workflows/e2e.yml'
    pull_request:
        branches: [main]
        paths:
            - 'fair-payments-connector/**'
            - 'fair-events/**'
            - 'fair-events-experimental/**'
            - 'fair-finance/**'
            - 'fair-audience/**'
            - 'fair-audience-experimental/**'
            - 'fair-form/**'
            - 'fair-platform/**'
            - 'fair-events-shared/**'
            - 'fair-timetable/**'
            - 'fair-calendar-button/**'
            - 'e2e/**'
            - 'playwright.config.js'
            - 'package.json'
            - 'scripts/api-test-runner.mjs'
            - 'scripts/workspace-e2e-runner.mjs'
            - 'scripts/block-docs.mjs'
            - 'scripts/__tests__/api-test-runner.test.mjs'
            - 'scripts/check-e2e-shards.mjs'
            - 'scripts/__tests__/check-e2e-shards.test.mjs'
            - 'scripts/shard-assignment.mjs'
            - 'scripts/shard-timings.mjs'
            - 'scripts/shard-timings/**'
            - 'scripts/__tests__/shard-assignment.test.mjs'
            - 'scripts/__tests__/shard-timings.test.mjs'
            - 'scripts/__tests__/fixtures/test-list/**'
            - '.wp-env.json'
            - '.github/workflows/e2e.yml'
    # Manual runs for CI benchmarks (TESTING.md § Rebalancing shards).
    workflow_dispatch:

jobs:
    # Lists the suite without WordPress, assigns whole spec files to shards by
    # recorded duration (scripts/shard-timings/e2e.json), and fails if the
    # assignment would skip or repeat a test. Keep --total in step with the
    # e2e-shard matrix.
    e2e-inventory:
        name: E2E shard inventory
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'

            - name: Cache node_modules
              id: npm-cache
              uses: actions/cache@v6
              with:
                  path: |
                      ./node_modules
                      ./fair-events/node_modules
                      ./fair-events-experimental/node_modules
                      ./fair-payments-connector/node_modules
                      ./fair-platform/node_modules
                      ./fair-audience/node_modules
                      ./fair-audience-experimental/node_modules
                      ./fair-form/node_modules
                      ./fair-events-shared/node_modules
                      ./fair-timetable/node_modules
                  key: ${{ runner.os }}-node-v2-${{ hashFiles('package-lock.json') }}

            - name: Install npm dependencies
              if: steps.npm-cache.outputs.cache-hit != 'true'
              run: HUSKY=0 npm ci --prefer-offline

            - name: Test shard assignment and inventory check
              run: node --test scripts/__tests__/shard-assignment.test.mjs scripts/__tests__/shard-timings.test.mjs scripts/__tests__/check-e2e-shards.test.mjs

            - name: Check every test runs in exactly one shard
              run: node scripts/check-e2e-shards.mjs --total=4

    # Each shard is a separate runner with its own wp-env containers, database,
    # uploads, captured emails and settings. The runner computes the same
    # duration-based assignment as the inventory job and runs its shard's files
    # through --test-list. Inside a shard the suite stays sequential
    # (workers: 1) because specs mutate shared WordPress state.
    e2e-shard:
        name: E2E shard ${{ matrix.shard }}/4
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3, 4]

        steps:
            - uses: actions/checkout@v7

            - name: Setup PHP
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: '8.5'
                  extensions: mbstring, intl, zip
                  coverage: none

            - name: Cache Composer packages
              uses: actions/cache@v6
              with:
                  path: |
                      ./fair-payments-connector/vendor
                      ./fair-events/vendor
                      ./fair-events-experimental/vendor
                      ./fair-platform/vendor
                      ./fair-audience/vendor
                      ./fair-audience-experimental/vendor
                      ./fair-form/vendor
                      ./vendor
                  key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'

            - name: Cache node_modules
              id: npm-cache
              uses: actions/cache@v6
              with:
                  path: |
                      ./node_modules
                      ./fair-events/node_modules
                      ./fair-events-experimental/node_modules
                      ./fair-payments-connector/node_modules
                      ./fair-platform/node_modules
                      ./fair-audience/node_modules
                      ./fair-audience-experimental/node_modules
                      ./fair-form/node_modules
                      ./fair-events-shared/node_modules
                      ./fair-timetable/node_modules
                  key: ${{ runner.os }}-node-v2-${{ hashFiles('package-lock.json') }}

            - name: Install npm dependencies
              if: steps.npm-cache.outputs.cache-hit != 'true'
              run: HUSKY=0 npm ci --prefer-offline

            - name: Install WP-CLI
              run: |
                  curl --fail --location --show-error \
                      --retry 5 --retry-all-errors --retry-delay 3 \
                      --connect-timeout 20 --max-time 180 \
                      --output wp-cli.phar \
                      https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
                  echo "be928f6b8ca1e8dfb9d2f4b75a13aa4aee0896f8a9a0a1c45cd5d2c98605e6172e6d014dda2e27f88c98befc16c040cbb2bd1bfa121510ea5cdf5f6a30fe8832  wp-cli.phar" | sha512sum -c -
                  chmod +x wp-cli.phar
                  sudo mv wp-cli.phar /usr/local/bin/wp
                  wp --info

            - name: Cache Playwright browsers
              id: playwright-cache
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
                  restore-keys: ${{ runner.os }}-playwright-

            # No `--with-deps`: the runner image already ships the system
            # libraries Chromium needs (it preinstalls Google Chrome), so the
            # job never waits on the Ubuntu APT mirror. If a library goes
            # missing, Playwright fails at browser launch and names it.
            - name: Install Playwright browser
              run: npx playwright install chromium

            - name: Check Chromium system libraries
              run: |
                  status=0
                  echo '### Chromium system libraries' >> "$GITHUB_STEP_SUMMARY"
                  for bin in $(find ~/.cache/ms-playwright -type f \( -name chrome -o -name headless_shell -o -name chrome-headless-shell \) -path '*linux*'); do
                      missing=$(ldd "$bin" | grep 'not found' || true)
                      [ -n "$missing" ] && status=1
                      echo "- \`${bin#"$HOME"/}\`: ${missing:-all libraries found}" | tee -a "$GITHUB_STEP_SUMMARY"
                  done
                  echo "- Fonts installed: $(fc-list | wc -l)" | tee -a "$GITHUB_STEP_SUMMARY"
                  exit $status

            - name: Read PHP version from wp-env config
              id: wp-env-config
              run: echo "php_version=$(jq -r '.phpVersion' .wp-env.json)" >> $GITHUB_OUTPUT

            - name: Cache Docker images
              id: docker-cache
              uses: actions/cache@v6
              with:
                  path: /tmp/docker-images.tar
                  key: ${{ runner.os }}-docker-v2-php${{ steps.wp-env-config.outputs.php_version }}-${{ hashFiles('.wp-env.json') }}
                  restore-keys: ${{ runner.os }}-docker-v2-php${{ steps.wp-env-config.outputs.php_version }}-

            - name: Load cached Docker images
              if: steps.docker-cache.outputs.cache-hit == 'true'
              run: docker load -i /tmp/docker-images.tar

            - name: Pull Docker images
              if: steps.docker-cache.outputs.cache-hit != 'true'
              run: |
                  docker pull wordpress:php${{ steps.wp-env-config.outputs.php_version }}
                  docker pull wordpress:cli-php${{ steps.wp-env-config.outputs.php_version }}
                  docker pull mariadb:lts
                  docker pull phpmyadmin

            - name: Save Docker images to cache
              if: steps.docker-cache.outputs.cache-hit != 'true'
              run: docker save wordpress:php${{ steps.wp-env-config.outputs.php_version }} wordpress:cli-php${{ steps.wp-env-config.outputs.php_version }} mariadb:lts phpmyadmin -o /tmp/docker-images.tar

            - name: Test lifecycle runner
              run: node --test scripts/__tests__/api-test-runner.test.mjs

            - name: Prepare environment and run E2E tests
              run: npm run test:e2e:local -- --shard=${{ matrix.shard }}/4

            # Uploaded on success too, so every shard's timings and flaky
            # retries stay available for comparison.
            - name: Upload Playwright report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report-shard-${{ matrix.shard }}-of-4-attempt-${{ github.run_attempt }}
                  path: |
                      playwright-report/
                      test-results/
                      e2e-results/
                  retention-days: 7
                  if-no-files-found: ignore

    # Single status for the whole suite: fails unless the inventory check and
    # every shard succeeded (a failed, cancelled or skipped shard fails it).
    e2e:
        name: E2E
        runs-on: ubuntu-latest
        needs: [e2e-inventory, e2e-shard]
        if: ${{ always() }}

        steps:
            - name: Check inventory and shard results
              env:
                  INVENTORY_RESULT: ${{ needs.e2e-inventory.result }}
                  SHARDS_RESULT: ${{ needs.e2e-shard.result }}
              run: |
                  echo "Shard inventory: $INVENTORY_RESULT"
                  echo "E2E shards: $SHARDS_RESULT"
                  if [ "$INVENTORY_RESULT" != success ] || [ "$SHARDS_RESULT" != success ]; then
                      echo "::error::E2E failed; open the failing 'E2E shard N/4' job and its playwright-report-shard-N-of-4 artifact."
                      exit 1
                  fi
