name: E2E

permissions:
    contents: read

# Reusable suite workflow, called by integration-tests.yml with the exact id
# of the run's prepared build (#2326). Its status check, "E2E", lives in
# the caller. Run it manually through Integration Tests (suites: e2e).
on:
    workflow_call:
        inputs:
            artifact_id:
                description: 'Artifact id of the prepared integration build of this run'
                type: string
                required: true
            prepared_attempt:
                description: 'Run attempt that prepared the build'
                type: string
                required: true
            php_diagnostics:
                description: 'PHP diagnostics sweep'
                type: boolean
                default: false
            simulate_preparation_failure:
                description: 'Environment preparation check: none, transient or persistent'
                type: string
                default: none

jobs:
    # Lists the suite without WordPress, assigns whole spec files to shards by
    # recorded duration (scripts/shard-timings/e2e.json), and fails if the
    # assignment would skip or repeat a test. Keep --total in step with the
    # e2e-shard matrix.
    e2e-inventory:
        name: E2E shard inventory
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'

            - name: Cache node_modules
              id: npm-cache
              uses: actions/cache@v6
              with:
                  path: |
                      ./node_modules
                      ./fair-events/node_modules
                      ./fair-events-experimental/node_modules
                      ./fair-payments-connector/node_modules
                      ./fair-platform/node_modules
                      ./fair-audience/node_modules
                      ./fair-audience-experimental/node_modules
                      ./fair-form/node_modules
                      ./fair-events-shared/node_modules
                      ./fair-timetable/node_modules
                  key: ${{ runner.os }}-node-v2-${{ hashFiles('package-lock.json') }}

            - name: Install npm dependencies
              if: steps.npm-cache.outputs.cache-hit != 'true'
              run: HUSKY=0 npm ci --prefer-offline

            - name: Test shard assignment and inventory check
              run: node --test scripts/__tests__/shard-assignment.test.mjs scripts/__tests__/shard-timings.test.mjs scripts/__tests__/check-e2e-shards.test.mjs

            - name: Check every test runs in exactly one shard
              run: node scripts/check-e2e-shards.mjs --total=4

    # Each shard is a separate runner with its own wp-env containers, database,
    # uploads, captured emails and settings. The runner computes the same
    # duration-based assignment as the inventory job and runs its shard's files
    # through --test-list. Inside a shard the suite stays sequential
    # (workers: 1) because specs mutate shared WordPress state.
    e2e-shard:
        name: E2E shard ${{ matrix.shard }}/4
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3, 4]

        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'

            - name: Cache node_modules
              id: npm-cache
              uses: actions/cache@v6
              with:
                  path: |
                      ./node_modules
                      ./fair-events/node_modules
                      ./fair-events-experimental/node_modules
                      ./fair-payments-connector/node_modules
                      ./fair-platform/node_modules
                      ./fair-audience/node_modules
                      ./fair-audience-experimental/node_modules
                      ./fair-form/node_modules
                      ./fair-events-shared/node_modules
                      ./fair-timetable/node_modules
                  key: ${{ runner.os }}-node-v2-${{ hashFiles('package-lock.json') }}

            - name: Install npm dependencies
              if: steps.npm-cache.outputs.cache-hit != 'true'
              run: HUSKY=0 npm ci --prefer-offline

            - name: Cache Playwright browsers
              id: playwright-cache
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
                  restore-keys: ${{ runner.os }}-playwright-

            # No `--with-deps`: the runner image already ships the system
            # libraries Chromium needs (it preinstalls Google Chrome), so the
            # job never waits on the Ubuntu APT mirror. If a library goes
            # missing, Playwright fails at browser launch and names it.
            - name: Install Playwright browser
              run: npx playwright install chromium

            - name: Check Chromium system libraries
              run: |
                  status=0
                  echo '### Chromium system libraries' >> "$GITHUB_STEP_SUMMARY"
                  for bin in $(find ~/.cache/ms-playwright -type f \( -name chrome -o -name headless_shell -o -name chrome-headless-shell \) -path '*linux*'); do
                      missing=$(ldd "$bin" | grep 'not found' || true)
                      [ -n "$missing" ] && status=1
                      echo "- \`${bin#"$HOME"/}\`: ${missing:-all libraries found}" | tee -a "$GITHUB_STEP_SUMMARY"
                  done
                  echo "- Fonts installed: $(fc-list | wc -l)" | tee -a "$GITHUB_STEP_SUMMARY"
                  exit $status

            # The exact build of this run's preparation job; never rebuilt,
            # and never another run's. A missing (expired or deleted) artifact
            # fails here, before WordPress starts.
            - name: Download prepared integration build
              id: prepared-download
              continue-on-error: true
              uses: actions/download-artifact@v8
              with:
                  artifact-ids: ${{ inputs.artifact_id }}
                  path: integration-build
                  merge-multiple: true

            - name: Restore prepared integration build
              env:
                  DOWNLOAD_OUTCOME: ${{ steps.prepared-download.outcome }}
                  ARTIFACT_ID: ${{ inputs.artifact_id }}
                  PREPARED_ATTEMPT: ${{ inputs.prepared_attempt }}
              run: |
                  if [ "$DOWNLOAD_OUTCOME" != success ]; then
                      echo "::error::Could not download prepared build artifact $ARTIFACT_ID (integration-build-attempt-$PREPARED_ATTEMPT); it may have expired after 30 days or been deleted. Re-run all jobs to prepare a new build; shards never rebuild or use another run's build."
                      exit 1
                  fi
                  node scripts/integration-build.mjs restore --dir=integration-build --run-id=${{ github.run_id }} --run-attempt="$PREPARED_ATTEMPT"

            # Restores or builds every image wp-env needs, retrying transient
            # download errors; the lifecycle runner then starts wp-env from
            # them without building or pulling (TESTING.md § CI environment
            # images). A failure here is an environment problem: no test ran.
            - name: Prepare WordPress environment images
              uses: ./.github/actions/prepare-wp-env
              env:
                  WP_ENV_IMAGES_SIMULATE_FAILURE: ${{ inputs.simulate_preparation_failure || 'none' }}
              with:
                  artifact-name: wp-env-prepare-e2e-shard-${{ matrix.shard }}-of-4-attempt-${{ github.run_attempt }}

            - name: Test lifecycle runner
              run: node --test scripts/__tests__/api-test-runner.test.mjs scripts/__tests__/php-diagnostics.test.mjs scripts/__tests__/wp-env-images.test.mjs

            # PHP_DIAGNOSTICS is empty unless a manual dispatch opts in.
            - name: Prepare environment and run E2E tests
              env:
                  PHP_DIAGNOSTICS: ${{ inputs.php_diagnostics && '--php-diagnostics' || '' }}
              run: npm run test:e2e:local -- --prepared --shard=${{ matrix.shard }}/4 $PHP_DIAGNOSTICS

            # Uploaded on success too, so every shard's timings and flaky
            # retries stay available for comparison.
            - name: Upload Playwright report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report-shard-${{ matrix.shard }}-of-4-attempt-${{ github.run_attempt }}
                  path: |
                      playwright-report/
                      test-results/
                      e2e-results/
                  retention-days: 7
                  if-no-files-found: ignore

            # The raw logs, report.json and summary.md of a diagnostics sweep.
            # Not named api-*, so the API status job never mistakes it for
            # shard results. The summary is also in this job's summary.
            - name: Upload PHP diagnostics
              if: ${{ !cancelled() && inputs.php_diagnostics }}
              uses: actions/upload-artifact@v7
              with:
                  name: php-diagnostics-e2e-shard-${{ matrix.shard }}-of-4-attempt-${{ github.run_attempt }}
                  path: php-diagnostics/
                  retention-days: 14
                  if-no-files-found: warn
