name: E2E

permissions:
    contents: read

on:
    push:
        branches: [main]
        paths:
            - 'fair-payments-connector/**'
            - 'fair-events/**'
            - 'fair-events-experimental/**'
            - 'fair-finance/**'
            - 'fair-audience/**'
            - 'fair-audience-experimental/**'
            - 'fair-form/**'
            - 'fair-platform/**'
            - 'fair-events-shared/**'
            - 'fair-timetable/**'
            - 'fair-calendar-button/**'
            - 'e2e/**'
            - 'playwright.config.js'
            - 'package.json'
            - 'scripts/api-test-runner.mjs'
            - 'scripts/workspace-e2e-runner.mjs'
            - 'scripts/block-docs.mjs'
            - 'scripts/__tests__/api-test-runner.test.mjs'
            - 'scripts/e2e-system-deps.mjs'
            - 'scripts/__tests__/e2e-system-deps.test.mjs'
            - '.wp-env.json'
            - '.github/workflows/e2e.yml'
    pull_request:
        branches: [main]
        paths:
            - 'fair-payments-connector/**'
            - 'fair-events/**'
            - 'fair-events-experimental/**'
            - 'fair-finance/**'
            - 'fair-audience/**'
            - 'fair-audience-experimental/**'
            - 'fair-form/**'
            - 'fair-platform/**'
            - 'fair-events-shared/**'
            - 'fair-timetable/**'
            - 'fair-calendar-button/**'
            - 'e2e/**'
            - 'playwright.config.js'
            - 'package.json'
            - 'scripts/api-test-runner.mjs'
            - 'scripts/workspace-e2e-runner.mjs'
            - 'scripts/block-docs.mjs'
            - 'scripts/__tests__/api-test-runner.test.mjs'
            - 'scripts/e2e-system-deps.mjs'
            - 'scripts/__tests__/e2e-system-deps.test.mjs'
            - '.wp-env.json'
            - '.github/workflows/e2e.yml'

jobs:
    e2e:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - name: Setup PHP
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: '8.5'
                  extensions: mbstring, intl, zip
                  coverage: none

            - name: Cache Composer packages
              uses: actions/cache@v6
              with:
                  path: |
                      ./fair-payments-connector/vendor
                      ./fair-events/vendor
                      ./fair-events-experimental/vendor
                      ./fair-platform/vendor
                      ./fair-audience/vendor
                      ./fair-audience-experimental/vendor
                      ./fair-form/vendor
                      ./vendor
                  key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'

            - name: Cache node_modules
              id: npm-cache
              uses: actions/cache@v6
              with:
                  path: |
                      ./node_modules
                      ./fair-events/node_modules
                      ./fair-events-experimental/node_modules
                      ./fair-payments-connector/node_modules
                      ./fair-platform/node_modules
                      ./fair-audience/node_modules
                      ./fair-audience-experimental/node_modules
                      ./fair-form/node_modules
                      ./fair-events-shared/node_modules
                      ./fair-timetable/node_modules
                  key: ${{ runner.os }}-node-v2-${{ hashFiles('package-lock.json') }}

            - name: Install npm dependencies
              if: steps.npm-cache.outputs.cache-hit != 'true'
              run: HUSKY=0 npm ci --prefer-offline

            - name: Install WP-CLI
              run: |
                  curl -L -o wp-cli.phar https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
                  echo "be928f6b8ca1e8dfb9d2f4b75a13aa4aee0896f8a9a0a1c45cd5d2c98605e6172e6d014dda2e27f88c98befc16c040cbb2bd1bfa121510ea5cdf5f6a30fe8832  wp-cli.phar" | sha512sum -c -
                  chmod +x wp-cli.phar
                  sudo mv wp-cli.phar /usr/local/bin/wp
                  wp --info

            - name: Cache Playwright browsers
              id: playwright-cache
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
                  restore-keys: ${{ runner.os }}-playwright-

            - name: Install Playwright browser
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: npx playwright install chromium

            # Linux system dependencies: only the downloaded .deb archives are
            # cached. APT refreshes its indexes and installs on every run, and
            # restored archives must match the fresh index's SHA256. See
            # TESTING.md § E2E system dependencies.
            - name: Start system dependency timer
              run: echo "E2E_DEPS_STARTED_AT=$(date +%s%3N)" >> "$GITHUB_ENV"

            - name: Compute system dependency cache key
              id: system-deps-key
              run: node scripts/e2e-system-deps.mjs key >> "$GITHUB_OUTPUT"

            - name: Restore system dependency archives
              id: system-deps-cache
              uses: actions/cache/restore@v6
              with:
                  path: ${{ steps.system-deps-key.outputs.path }}
                  key: ${{ steps.system-deps-key.outputs.key }}

            - name: Install Playwright system dependencies
              env:
                  E2E_DEPS_CACHE_HIT: ${{ steps.system-deps-cache.outputs.cache-hit }}
              run: node scripts/e2e-system-deps.mjs install

            - name: Save system dependency archives
              id: system-deps-save
              if: steps.system-deps-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@v6
              with:
                  path: ${{ steps.system-deps-key.outputs.path }}
                  key: ${{ steps.system-deps-key.outputs.key }}

            - name: Report system dependency preparation
              if: always() && steps.system-deps-key.outcome == 'success'
              env:
                  E2E_DEPS_SAVE_OUTCOME: ${{ steps.system-deps-save.outcome }}
              run: node scripts/e2e-system-deps.mjs report

            - name: Upload system dependency report
              if: always() && steps.system-deps-key.outcome == 'success'
              uses: actions/upload-artifact@v7
              with:
                  name: e2e-system-deps
                  path: ${{ runner.temp }}/e2e-system-deps/
                  retention-days: 30
                  if-no-files-found: ignore

            - name: Read PHP version from wp-env config
              id: wp-env-config
              run: echo "php_version=$(jq -r '.phpVersion' .wp-env.json)" >> $GITHUB_OUTPUT

            - name: Cache Docker images
              id: docker-cache
              uses: actions/cache@v6
              with:
                  path: /tmp/docker-images.tar
                  key: ${{ runner.os }}-docker-v2-php${{ steps.wp-env-config.outputs.php_version }}-${{ hashFiles('.wp-env.json') }}
                  restore-keys: ${{ runner.os }}-docker-v2-php${{ steps.wp-env-config.outputs.php_version }}-

            - name: Load cached Docker images
              if: steps.docker-cache.outputs.cache-hit == 'true'
              run: docker load -i /tmp/docker-images.tar

            - name: Pull Docker images
              if: steps.docker-cache.outputs.cache-hit != 'true'
              run: |
                  docker pull wordpress:php${{ steps.wp-env-config.outputs.php_version }}
                  docker pull wordpress:cli-php${{ steps.wp-env-config.outputs.php_version }}
                  docker pull mariadb:lts
                  docker pull phpmyadmin

            - name: Save Docker images to cache
              if: steps.docker-cache.outputs.cache-hit != 'true'
              run: docker save wordpress:php${{ steps.wp-env-config.outputs.php_version }} wordpress:cli-php${{ steps.wp-env-config.outputs.php_version }} mariadb:lts phpmyadmin -o /tmp/docker-images.tar

            - name: Test lifecycle runner
              run: node --test scripts/__tests__/api-test-runner.test.mjs

            - name: Prepare environment and run E2E tests
              run: npm run test:e2e:local

            - name: Upload Playwright report
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 7
                  if-no-files-found: ignore
