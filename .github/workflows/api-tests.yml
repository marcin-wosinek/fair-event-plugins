name: API Tests

permissions:
    contents: read

# Reusable suite workflow, called by integration-tests.yml with the exact id
# of the run's prepared build (#2326). Its status check, "API Tests", lives in
# the caller. Run it manually through Integration Tests (suites: api).
on:
    workflow_call:
        inputs:
            artifact_id:
                description: 'Artifact id of the prepared integration build of this run'
                type: string
                required: true
            prepared_attempt:
                description: 'Run attempt that prepared the build'
                type: string
                required: true
            php_diagnostics:
                description: 'PHP diagnostics sweep'
                type: boolean
                default: false
            simulate_preparation_failure:
                description: 'Environment preparation check: none, transient or persistent'
                type: string
                default: none

jobs:
    # Lists every API workspace's suite without WordPress, through each
    # workspace's own test:api script, assigns the spec files of all
    # workspaces to shards by recorded duration (scripts/shard-timings/api.json),
    # and fails if the assignment would skip or repeat a test. Keep --total in
    # step with the api-shard matrix.
    api-inventory:
        name: API shard inventory
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'

            - name: Cache node_modules
              id: npm-cache
              uses: actions/cache@v6
              with:
                  path: |
                      ./node_modules
                      ./fair-events/node_modules
                      ./fair-events-experimental/node_modules
                      ./fair-payments-connector/node_modules
                      ./fair-platform/node_modules
                      ./fair-audience/node_modules
                      ./fair-audience-experimental/node_modules
                      ./fair-form/node_modules
                      ./fair-finance/node_modules
                      ./fair-payments-connector-experimental/node_modules
                      ./fair-events-shared/node_modules
                      ./fair-timetable/node_modules
                  key: ${{ runner.os }}-node-v2-${{ hashFiles('package-lock.json') }}

            - name: Install npm dependencies
              if: steps.npm-cache.outputs.cache-hit != 'true'
              run: HUSKY=0 npm ci --prefer-offline

            - name: Test shard inventory check and lifecycle runner
              run: node --test scripts/__tests__/shard-assignment.test.mjs scripts/__tests__/shard-timings.test.mjs scripts/__tests__/check-api-shards.test.mjs scripts/__tests__/api-test-runner.test.mjs scripts/__tests__/php-diagnostics.test.mjs scripts/__tests__/wp-env-images.test.mjs

            - name: Check every API test runs in exactly one shard
              run: node scripts/check-api-shards.mjs --total=4 --output=api-inventory.json

            - name: Upload planned inventory
              uses: actions/upload-artifact@v7
              with:
                  name: api-inventory-attempt-${{ github.run_attempt }}
                  path: api-inventory.json
                  retention-days: 7

    # Each shard is a separate runner with its own wp-env containers, database,
    # uploads, captured emails and settings. The runner computes the same
    # duration-based assignment as the inventory job; every API workspace with
    # files in the shard runs them through --test-list, and one with none is
    # skipped. Inside a shard the suite stays sequential (workers: 1) because
    # specs mutate shared WordPress state.
    api-shard:
        name: API shard ${{ matrix.shard }}/4
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3, 4]

        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'

            - name: Cache node_modules
              id: npm-cache
              uses: actions/cache@v6
              with:
                  path: |
                      ./node_modules
                      ./fair-events/node_modules
                      ./fair-events-experimental/node_modules
                      ./fair-payments-connector/node_modules
                      ./fair-platform/node_modules
                      ./fair-audience/node_modules
                      ./fair-audience-experimental/node_modules
                      ./fair-form/node_modules
                      ./fair-finance/node_modules
                      ./fair-payments-connector-experimental/node_modules
                      ./fair-events-shared/node_modules
                      ./fair-timetable/node_modules
                  key: ${{ runner.os }}-node-v2-${{ hashFiles('package-lock.json') }}

            - name: Install npm dependencies
              if: steps.npm-cache.outputs.cache-hit != 'true'
              run: HUSKY=0 npm ci --prefer-offline

            # The exact build of this run's preparation job; never rebuilt,
            # and never another run's. A missing (expired or deleted) artifact
            # fails here, before WordPress starts.
            - name: Download prepared integration build
              id: prepared-download
              continue-on-error: true
              uses: actions/download-artifact@v8
              with:
                  artifact-ids: ${{ inputs.artifact_id }}
                  path: integration-build
                  merge-multiple: true

            - name: Restore prepared integration build
              env:
                  DOWNLOAD_OUTCOME: ${{ steps.prepared-download.outcome }}
                  ARTIFACT_ID: ${{ inputs.artifact_id }}
                  PREPARED_ATTEMPT: ${{ inputs.prepared_attempt }}
              run: |
                  if [ "$DOWNLOAD_OUTCOME" != success ]; then
                      echo "::error::Could not download prepared build artifact $ARTIFACT_ID (integration-build-attempt-$PREPARED_ATTEMPT); it may have expired after 30 days or been deleted. Re-run all jobs to prepare a new build; shards never rebuild or use another run's build."
                      exit 1
                  fi
                  node scripts/integration-build.mjs restore --dir=integration-build --run-id=${{ github.run_id }} --run-attempt="$PREPARED_ATTEMPT"

            # Restores or builds every image wp-env needs, retrying transient
            # download errors; the lifecycle runner then starts wp-env from
            # them without building or pulling (TESTING.md § CI environment
            # images). A failure here is an environment problem: no test ran.
            - name: Prepare WordPress environment images
              uses: ./.github/actions/prepare-wp-env
              env:
                  WP_ENV_IMAGES_SIMULATE_FAILURE: ${{ inputs.simulate_preparation_failure || 'none' }}
              with:
                  artifact-name: wp-env-prepare-api-shard-${{ matrix.shard }}-of-4-attempt-${{ github.run_attempt }}

            # PHP_DIAGNOSTICS is empty unless a manual dispatch opts in.
            - name: Prepare environment and run API tests
              env:
                  PHP_DIAGNOSTICS: ${{ inputs.php_diagnostics && '--php-diagnostics' || '' }}
              run: npm run test:api:local -- --prepared --shard=${{ matrix.shard }}/4 --results-dir=api-results $PHP_DIAGNOSTICS

            # Uploaded on success too, so phase timings (api-results/timings.json),
            # per-workspace results and flaky retries stay available for
            # comparison. The status job reads the JSON results from here.
            - name: Upload Playwright report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v7
              with:
                  name: api-report-shard-${{ matrix.shard }}-of-4-attempt-${{ github.run_attempt }}
                  path: |
                      api-results/
                      */playwright-report/
                      */test-results/
                  retention-days: 7
                  if-no-files-found: ignore

            # The raw logs, report.json and summary.md of a diagnostics sweep.
            # Not named api-*, so the API status job never mistakes it for
            # shard results. The summary is also in this job's summary.
            - name: Upload PHP diagnostics
              if: ${{ !cancelled() && inputs.php_diagnostics }}
              uses: actions/upload-artifact@v7
              with:
                  name: php-diagnostics-api-shard-${{ matrix.shard }}-of-4-attempt-${{ github.run_attempt }}
                  path: php-diagnostics/
                  retention-days: 14
                  if-no-files-found: warn
