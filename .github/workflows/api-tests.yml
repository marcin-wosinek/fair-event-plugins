name: API Tests

permissions:
    contents: read

on:
    push:
        branches: [main]
        paths:
            - '**/src/API/**'
            - '**/src/blocks/**'
            - '**/src/Hooks/BlockHooks.php'
            - 'scripts/block-docs.mjs'
            - '**/playwright.config.js'
            - '.wp-env.json'
            - 'package.json'
            - 'scripts/api-test-runner.mjs'
            - 'scripts/__tests__/api-test-runner.test.mjs'
            - 'scripts/check-api-shards.mjs'
            - 'scripts/check-e2e-shards.mjs'
            - 'scripts/__tests__/check-api-shards.test.mjs'
            - 'scripts/shard-assignment.mjs'
            - 'scripts/shard-timings.mjs'
            - 'scripts/shard-timings/**'
            - 'scripts/__tests__/shard-assignment.test.mjs'
            - 'scripts/__tests__/shard-timings.test.mjs'
            - 'scripts/__tests__/fixtures/test-list/**'
            - 'e2e/mu-plugins/**'
            - '.github/workflows/api-tests.yml'
    pull_request:
        branches: [main]
        paths:
            - '**/src/API/**'
            - '**/src/blocks/**'
            - '**/src/Hooks/BlockHooks.php'
            - 'scripts/block-docs.mjs'
            - '**/playwright.config.js'
            - '.wp-env.json'
            - 'package.json'
            - 'scripts/api-test-runner.mjs'
            - 'scripts/__tests__/api-test-runner.test.mjs'
            - 'scripts/check-api-shards.mjs'
            - 'scripts/check-e2e-shards.mjs'
            - 'scripts/__tests__/check-api-shards.test.mjs'
            - 'scripts/shard-assignment.mjs'
            - 'scripts/shard-timings.mjs'
            - 'scripts/shard-timings/**'
            - 'scripts/__tests__/shard-assignment.test.mjs'
            - 'scripts/__tests__/shard-timings.test.mjs'
            - 'scripts/__tests__/fixtures/test-list/**'
            - 'e2e/mu-plugins/**'
            - '.github/workflows/api-tests.yml'
    # Manual runs for CI benchmarks (TESTING.md § REST API tests).
    workflow_dispatch:

jobs:
    # Lists every API workspace's suite without WordPress, through each
    # workspace's own test:api script, assigns the spec files of all
    # workspaces to shards by recorded duration (scripts/shard-timings/api.json),
    # and fails if the assignment would skip or repeat a test. Keep --total in
    # step with the api-shard matrix.
    api-inventory:
        name: API shard inventory
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'

            - name: Cache node_modules
              id: npm-cache
              uses: actions/cache@v6
              with:
                  path: |
                      ./node_modules
                      ./fair-events/node_modules
                      ./fair-events-experimental/node_modules
                      ./fair-payments-connector/node_modules
                      ./fair-platform/node_modules
                      ./fair-audience/node_modules
                      ./fair-audience-experimental/node_modules
                      ./fair-form/node_modules
                      ./fair-finance/node_modules
                      ./fair-payments-connector-experimental/node_modules
                      ./fair-events-shared/node_modules
                      ./fair-timetable/node_modules
                  key: ${{ runner.os }}-node-v2-${{ hashFiles('package-lock.json') }}

            - name: Install npm dependencies
              if: steps.npm-cache.outputs.cache-hit != 'true'
              run: HUSKY=0 npm ci --prefer-offline

            - name: Test shard inventory check and lifecycle runner
              run: node --test scripts/__tests__/shard-assignment.test.mjs scripts/__tests__/shard-timings.test.mjs scripts/__tests__/check-api-shards.test.mjs scripts/__tests__/api-test-runner.test.mjs

            - name: Check every API test runs in exactly one shard
              run: node scripts/check-api-shards.mjs --total=4 --output=api-inventory.json

            - name: Upload planned inventory
              uses: actions/upload-artifact@v7
              with:
                  name: api-inventory-attempt-${{ github.run_attempt }}
                  path: api-inventory.json
                  retention-days: 7

    # Each shard is a separate runner with its own wp-env containers, database,
    # uploads, captured emails and settings. The runner computes the same
    # duration-based assignment as the inventory job; every API workspace with
    # files in the shard runs them through --test-list, and one with none is
    # skipped. Inside a shard the suite stays sequential (workers: 1) because
    # specs mutate shared WordPress state.
    api-shard:
        name: API shard ${{ matrix.shard }}/4
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3, 4]

        steps:
            - uses: actions/checkout@v7

            - name: Setup PHP
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: '8.5'
                  extensions: mbstring, intl, zip
                  coverage: none

            - name: Cache Composer packages
              uses: actions/cache@v6
              with:
                  path: |
                      ./fair-payments-connector/vendor
                      ./fair-events/vendor
                      ./fair-events-experimental/vendor
                      ./fair-platform/vendor
                      ./fair-audience/vendor
                      ./fair-audience-experimental/vendor
                      ./fair-form/vendor
                      ./fair-finance/vendor
                      ./fair-payments-connector-experimental/vendor
                      ./vendor
                  key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'

            - name: Cache node_modules
              id: npm-cache
              uses: actions/cache@v6
              with:
                  path: |
                      ./node_modules
                      ./fair-events/node_modules
                      ./fair-events-experimental/node_modules
                      ./fair-payments-connector/node_modules
                      ./fair-platform/node_modules
                      ./fair-audience/node_modules
                      ./fair-audience-experimental/node_modules
                      ./fair-form/node_modules
                      ./fair-finance/node_modules
                      ./fair-payments-connector-experimental/node_modules
                      ./fair-events-shared/node_modules
                      ./fair-timetable/node_modules
                  key: ${{ runner.os }}-node-v2-${{ hashFiles('package-lock.json') }}

            - name: Install npm dependencies
              if: steps.npm-cache.outputs.cache-hit != 'true'
              run: HUSKY=0 npm ci --prefer-offline

            - name: Install WP-CLI
              run: |
                  curl --fail --location --show-error \
                      --retry 5 --retry-all-errors --retry-delay 3 \
                      --connect-timeout 20 --max-time 180 \
                      --output wp-cli.phar \
                      https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
                  echo "be928f6b8ca1e8dfb9d2f4b75a13aa4aee0896f8a9a0a1c45cd5d2c98605e6172e6d014dda2e27f88c98befc16c040cbb2bd1bfa121510ea5cdf5f6a30fe8832  wp-cli.phar" | sha512sum -c -
                  chmod +x wp-cli.phar
                  sudo mv wp-cli.phar /usr/local/bin/wp
                  wp --info

            - name: Read PHP version from wp-env config
              id: wp-env-config
              run: echo "php_version=$(jq -r '.phpVersion' .wp-env.json)" >> $GITHUB_OUTPUT

            - name: Cache Docker images
              id: docker-cache
              uses: actions/cache@v6
              with:
                  path: /tmp/docker-images.tar
                  key: ${{ runner.os }}-docker-v2-php${{ steps.wp-env-config.outputs.php_version }}-${{ hashFiles('.wp-env.json') }}
                  restore-keys: ${{ runner.os }}-docker-v2-php${{ steps.wp-env-config.outputs.php_version }}-

            - name: Load cached Docker images
              if: steps.docker-cache.outputs.cache-hit == 'true'
              run: docker load -i /tmp/docker-images.tar

            - name: Pull Docker images
              if: steps.docker-cache.outputs.cache-hit != 'true'
              run: |
                  docker pull wordpress:php${{ steps.wp-env-config.outputs.php_version }}
                  docker pull wordpress:cli-php${{ steps.wp-env-config.outputs.php_version }}
                  docker pull mariadb:lts
                  docker pull phpmyadmin

            - name: Save Docker images to cache
              if: steps.docker-cache.outputs.cache-hit != 'true'
              run: docker save wordpress:php${{ steps.wp-env-config.outputs.php_version }} wordpress:cli-php${{ steps.wp-env-config.outputs.php_version }} mariadb:lts phpmyadmin -o /tmp/docker-images.tar

            - name: Prepare environment and run API tests
              run: npm run test:api:local -- --shard=${{ matrix.shard }}/4 --results-dir=api-results

            # Uploaded on success too, so phase timings (api-results/timings.json),
            # per-workspace results and flaky retries stay available for
            # comparison. The status job reads the JSON results from here.
            - name: Upload Playwright report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v7
              with:
                  name: api-report-shard-${{ matrix.shard }}-of-4-attempt-${{ github.run_attempt }}
                  path: |
                      api-results/
                      */playwright-report/
                      */test-results/
                  retention-days: 7
                  if-no-files-found: ignore

    # Single status for the whole suite: fails unless the inventory check and
    # every shard succeeded (a failed, cancelled or skipped shard fails it), or
    # if any planned test did not run in its shard.
    api:
        name: API Tests
        runs-on: ubuntu-latest
        needs: [api-inventory, api-shard]
        if: ${{ always() }}

        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'

            # All attempts: after "Re-run failed jobs" the shards that passed
            # earlier keep their artifacts, and the latest attempt wins.
            - name: Download inventory and shard results
              if: ${{ needs.api-inventory.result == 'success' }}
              uses: actions/download-artifact@v8
              with:
                  pattern: api-*
                  path: api-artifacts

            - name: Check every planned test ran
              id: coverage
              if: ${{ needs.api-inventory.result == 'success' }}
              run: node scripts/check-api-shards.mjs --verify --results=api-artifacts

            - name: Check inventory and shard results
              if: ${{ always() }}
              env:
                  INVENTORY_RESULT: ${{ needs.api-inventory.result }}
                  SHARDS_RESULT: ${{ needs.api-shard.result }}
                  COVERAGE_RESULT: ${{ steps.coverage.outcome }}
              run: |
                  echo "Shard inventory: $INVENTORY_RESULT"
                  echo "API shards: $SHARDS_RESULT"
                  echo "Executed coverage: $COVERAGE_RESULT"
                  if [ "$INVENTORY_RESULT" != success ] || [ "$SHARDS_RESULT" != success ] || [ "$COVERAGE_RESULT" != success ]; then
                      echo "::error::API tests failed; open the failing 'API shard N/4' job (its log names the failing workspace) and its api-report-shard-N-of-4 artifact."
                      exit 1
                  fi
