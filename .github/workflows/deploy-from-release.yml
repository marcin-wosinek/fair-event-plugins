name: Deploy from release

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            release_tag:
                description: 'Release tag to deploy (e.g., build-1.0.0)'
                required: true
                type: string
            acroyoga-club-es:
                description: 'acroyoga-club.es'
                type: boolean
                default: false
            fair-event-plugins-com:
                description: 'fair-event-plugins.com'
                type: boolean
                default: false
            lamutable-es:
                description: 'lamutable.es'
                type: boolean
                default: false
            fusion-dance-es:
                description: 'fusion-dance.es'
                type: boolean
                default: false
            acro-agenda-es:
                description: 'acro-agenda.es'
                type: boolean
                default: false
            fusion-circus-com:
                description: 'fusion-circus.com'
                type: boolean
                default: false
            circus-it-eu:
                description: 'circus-it.eu'
                type: boolean
                default: false

jobs:
    resolve:
        name: Resolve release
        runs-on: ubuntu-latest
        outputs:
            release_tag: ${{ steps.resolve.outputs.release_tag }}
            is_clean_version: ${{ steps.resolve.outputs.is_clean_version }}
        steps:
            # Both tags reach the script as variables, never as `${{ }}`
            # expressions, and only a build tag CI creates is written to the
            # outputs: build-X.Y.Z, or build-X.Y.Z-N-gHASH between releases.
            - name: Resolve release tag and version type
              id: resolve
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  RELEASE_EVENT_TAG: ${{ github.event.release.tag_name }}
                  DISPATCH_TAG: ${{ inputs.release_tag }}
              run: |
                  if [ "$EVENT_NAME" = "release" ]; then
                    TAG="$RELEASE_EVENT_TAG"
                  else
                    TAG="$DISPATCH_TAG"
                  fi

                  if [[ ! "$TAG" =~ ^build-[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+-g[0-9a-f]+)?$ ]]; then
                    if [ "$EVENT_NAME" = "release" ]; then
                      # Another kind of release (e.g. a plugin tag); deploy nothing.
                      echo "::notice::The published release is not a build-X.Y.Z release; nothing to deploy."
                      echo "is_clean_version=false" >> "$GITHUB_OUTPUT"
                      exit 0
                    fi
                    echo "::error::The release_tag input must be build-X.Y.Z or build-X.Y.Z-N-gHASH, for example build-1.0.0."
                    exit 1
                  fi

                  echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"

                  # Strip "build-" prefix to get the version
                  VERSION="${TAG#build-}"

                  # Check if it's a clean semver (no -N-gHASH suffix)
                  if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "is_clean_version=true" >> "$GITHUB_OUTPUT"
                    echo "Clean version: ${VERSION}"
                  else
                    echo "is_clean_version=false" >> "$GITHUB_OUTPUT"
                    echo "Dirty version: ${VERSION}"
                  fi

    deploy-acroyoga:
        name: Deploy to acroyoga-club.es
        needs: [resolve]
        if: |
            needs.resolve.outputs.is_clean_version == 'true' ||
            (github.event_name == 'workflow_dispatch' && inputs.acroyoga-club-es)
        uses: ./.github/workflows/deploy-to-environment.yml
        with:
            environment: acroyoga-club.es
            release_tag: ${{ needs.resolve.outputs.release_tag }}
            is_clean_version: ${{ needs.resolve.outputs.is_clean_version }}
            is_manual_deploy: ${{ github.event_name == 'workflow_dispatch' }}
        secrets: inherit

    deploy-fair-event-plugins:
        name: Deploy to fair-event-plugins.com
        needs: [resolve]
        if: |
            needs.resolve.outputs.is_clean_version == 'true' ||
            (github.event_name == 'workflow_dispatch' && inputs.fair-event-plugins-com)
        uses: ./.github/workflows/deploy-to-environment.yml
        with:
            environment: fair-event-plugins.com
            release_tag: ${{ needs.resolve.outputs.release_tag }}
            is_clean_version: ${{ needs.resolve.outputs.is_clean_version }}
            is_manual_deploy: ${{ github.event_name == 'workflow_dispatch' }}
        secrets: inherit

    deploy-lamutable:
        name: Deploy to lamutable.es
        needs: [resolve]
        if: |
            needs.resolve.outputs.is_clean_version == 'true' ||
            (github.event_name == 'workflow_dispatch' && inputs.lamutable-es)
        uses: ./.github/workflows/deploy-to-environment.yml
        with:
